[project]
name = "tripcut-api"
version = "0.1.0"
description = "TripCut upload API: trips, clips, R2 multipart uploads, Supabase Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "boto3>=1.36",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "modal>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripcut_api"]
