[project]
name = "tripcut-api"
version = "0.1.0"
description = "TripCut upload API: trips, clips, R2 multipart uploads, Supabase Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "boto3>=1.36",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "modal>=1.0,<2.0",
]

[project.optional-dependencies]
# SAN-48 week-1 spike CLI (`tripcut`). Install with `uv sync --extra pipeline`.
# Not used by the API or its Modal image.
pipeline = [
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "open_clip_torch>=2.29",
    "torch>=2.5",
    "pillow>=10.4",
    "mediapipe>=0.10.18",
    "librosa>=0.10",
    "anthropic>=2.3,<3.0",
    "numpy>=1.26",
]

[project.scripts]
tripcut = "tripcut_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripcut_api", "src/tripcut_pipeline"]
